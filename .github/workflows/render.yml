name: Render video
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip latest uploaded zip
        run: |
          ZIP=$(ls -t $(find . -maxdepth 2 -name "*.zip" -not -path "./node_modules/*") | head -n 1)
          echo "Using: $ZIP"
          rm -rf _proj && mkdir _proj
          unzip -q "$ZIP" -d _proj
          PKG=$(find _proj -name package.json -not -path "*/node_modules/*" | head -n 1)
          echo "PROJ_DIR=$(dirname "$PKG")" >> $GITHUB_ENV

      - name: Install system libs for Chrome
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0

      - name: Install packages
        working-directory: ${{ env.PROJ_DIR }}
        run: npm install

      - name: Render
        working-directory: ${{ env.PROJ_DIR }}
        run: npx remotion render Intro out/intro.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: intro-video
          path: ${{ env.PROJ_DIR }}/out/intro.mp4
