name: Universal Auto Video Render

on:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '**/*.mp4'
      - '**/*.mov'
      - '**/*.mkv'
      - '**/*.html'
      - '**/*.py'
      - '**/*.mp3'
      - '**/*.wav'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Packages & Media Tools
        run: |
          sudo apt-get update
          # সঠিক প্যাকেজ নাম ব্যবহার করা হয়েছে (fonts-bengali এরর সমাধান)
          sudo apt-get install -y ffmpeg unzip xvfb fonts-lohit-beng-bengali fonts-noto-core

      - name: Unpack ONLY the Latest ZIP Archive
        run: |
          # একাধিক জিপ থাকলে সর্বশেষ আপলোড করা জিপটি বেছে নেবে
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)

          if [ -z "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(find . -name "*.zip" -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -f2- -d" ")
          fi

          if [ -n "$LATEST_ZIP" ]; then
            echo "Latest ZIP found: $LATEST_ZIP"
            unzip -o "$LATEST_ZIP"
          else
            echo "No zip archive found, proceeding with workspace files."
          fi

          # সাব-ফোল্ডারের ভেতর ফাইল থাকলে রুটে কপি করবে
          find . -mindepth 2 -name "*.html" -exec cp {} . \;
          find . -mindepth 2 -name "*.mp3" -exec cp {} . \;
          find . -mindepth 2 -name "*.wav" -exec cp {} . \;
          find . -mindepth 2 -name "*.py" -exec cp {} . \;

      - name: Install Python Dependencies & Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright moviepy selenium pillow numpy opencv-python webdriver-manager
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m playwright install --with-deps chromium || true

      - name: Execute Render Script with Virtual Screen
        run: |
          # render.py থাকলে সেটা, না পেলে যেকোনো .py ফাইল নেবে
          if [ -f "render.py" ]; then
            TARGET="render.py"
          else
            TARGET=$(find . -maxdepth 1 -name "*.py" | head -n 1)
          fi

          if [ -n "$TARGET" ]; then
            echo "Executing script: $TARGET"
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python "$TARGET"
          else
            echo "ERROR: কোনো পাইথন (.py) ফাইল খুঁজে পাওয়া যায়নি!"
            exit 1
          fi

      - name: Upload Final Rendered Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completed-rendered-video
          path: |
            *.mp4
            output/*.mp4
            final*.mp4
