name: Render MC Explorer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and render
        run: |
          set -e
          ZIP="remotion-mc-explorer-elite-github (1).zip"
          if [ ! -f "$ZIP" ]; then
            ZIP=$(ls *.zip | head -1)
          fi
          echo "Using zip: $ZIP"
          rm -rf app proj
          unzip -q "$ZIP" -d proj
          if [ -f proj/package.json ]; then
            mv proj app
          else
            SUB=$(find proj -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$SUB" app
          fi
          cd app
          npm install
          npm run build
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: mc-explorer-promo
          path: "**/mc-explorer.mp4"
