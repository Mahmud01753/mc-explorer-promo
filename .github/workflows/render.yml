name: Render Video

on:
  workflow_dispatch: # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান করার জন্য
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # যদি render.py-তে moviepy, selenium বা অন্য লাইব্রেরি থাকে:
          pip install moviepy pillow numpy

      - name: Run Render Script
        run: |
          python render.py

      - name: Upload Rendered Output
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            *.mp4
            output/
