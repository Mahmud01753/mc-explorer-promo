name: Render video

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip latest uploaded zip
        run: |
          ZIP=$(for f in *.zip; do [ -e "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then echo "No zip found in repo root"; exit 1; fi
          echo "Using zip: $ZIP"
          rm -rf _proj && mkdir _proj
          unzip -q "$ZIP" -d _proj
          PKG=$(find _proj -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PKG" ]; then echo "No package.json inside zip"; exit 1; fi
          echo "DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Install system libs for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libpango-1.0-0 libcairo2 fonts-noto

      - name: Install packages
        working-directory: ${{ env.DIR }}
        run: npm install

      - name: Render
        working-directory: ${{ env.DIR }}
        run: npx remotion render MCExplorer out/mc-explorer.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: mc-explorer-video
          path: ${{ env.DIR }}/out/mc-explorer.mp4
          retention-days: 7
